<!doctype html>
<html lang="ja">
  <meta charset="utf-8" />
  <title>本文表示のブラウザ検証</title>
  <style>
    html,
    body {
      margin: 0;
      height: 100%;
      background: #f0f1f2;
    }
    #root {
      height: calc(100% - 48px);
      margin: auto;
    }
    nav {
      height: 48px;
      display: flex;
      gap: 16px;
      align-items: center;
      justify-content: center;
    }
  </style>
  <div id="root"></div>
  <nav>
    <button id="previous">前へ</button><output id="status">準備中</output
    ><button id="next">次へ</button>
  </nav>
  <script type="module">
    import React from "react";
    import { createRoot } from "react-dom/client";
    import { PageView } from "./PageView.tsx";
    const root = createRoot(document.getElementById("root"));
    const paragraphs = Array.from(
      { length: 60 },
      (_, i) =>
        `<p id="p${i}">第${i + 1}段落。${"静かな森を歩きながら、木漏れ日の中で物語を読む。".repeat(8)}<ruby>読書<rt>どくしょ</rt></ruby>。</p>`,
    ).join("");
    let options = {
      xhtml: `<html xmlns="http://www.w3.org/1999/xhtml"><head></head><body><h1>森の物語</h1>${paragraphs}<p id="last">章の終わり</p></body></html>`,
      chapterPath: "OPS/chapter.xhtml",
      resourceBase: location.origin + "/book/1/",
      theme: "light",
    };
    let current = 0,
      count = 1,
      revision = 0;
    function render() {
      const expectedRevision = revision;
      root.render(
        React.createElement(PageView, {
          ...options,
          page: current,
          onPagination(result) {
            if (expectedRevision !== revision) return;
            current = result.page;
            count = result.count;
            document.getElementById("status").textContent =
              `${current + 1} / ${count}`;
          },
          onKeyDown(event) {
            window.readerKey = event.key;
          },
          onError(error) {
            if (expectedRevision !== revision) return;
            document.getElementById("status").textContent =
              `エラー: ${error.message}`;
          },
        }),
      );
    }
    window.readerFixture = {
      configure(value) {
        revision++;
        document.getElementById("status").textContent = "準備中";
        options = { ...options, ...value };
        current = 0;
        render();
      },
      go(value) {
        current = value;
        render();
      },
    };
    document.getElementById("previous").onclick = () => {
      current = Math.max(0, current - 1);
      render();
    };
    document.getElementById("next").onclick = () => {
      current = Math.min(count - 1, current + 1);
      render();
    };
    render();
  </script>
</html>
